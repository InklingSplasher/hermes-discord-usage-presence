name: hermes-discord-usage-presence
version: 0.1.0
description: Show Codex or Claude account usage in the Hermes Discord bot presence
author: Hermes Discord Usage Presence contributors
kind: standalone
provides_tools: []
provides_hooks: []
platforms:
  - discord
config_schema:
  provider:
    type: string
    default: codex
    enum:
      - codex
      - claude
    description: Account usage provider queried through Hermes
  window:
    type: string
    default: auto
    enum:
      - auto
      - session
      - weekly
      - fable_week
      - opus_week
      - sonnet_week
    description: Preferred usage window; auto uses provider-specific defaults
  interval_seconds:
    type: integer
    default: 300
    minimum: 60
    description: Seconds between usage refreshes
  bar_width:
    type: integer
    default: 10
    minimum: 1
    maximum: 30
    description: Number of cells in the usage bar
